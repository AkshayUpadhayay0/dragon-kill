<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Kill Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Welcome -->
  <div id="welcome-overlay" class="overlay">
    <h1>🐉 Dragon Kill Game</h1>
    <div class="divider"></div>
    <p>You have <strong>60 seconds</strong> to hunt as many humans as possible.<br>
      Move your mouse — the dragon follows!</p>
    <button id="btn-start">START GAME</button>
  </div>

  <!-- Game Over -->
  <div id="gameover-overlay" class="overlay hidden">
    <h1>GAME OVER</h1>
    <div class="divider"></div>
    <p>Your final score</p>
    <div id="gameover-score">000</div>
    <p class="score-label">humans devoured</p>
    <button id="btn-restart">PLAY AGAIN</button>
  </div>

  <!-- HUD -->
  <div id="score-display">Score — 000</div>
  <div id="timer-display">Time — 60</div>

  <svg id="screen" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <!-- Head -->
      <!-- <g id="Cabeza">
        <path fill="#000"
          d="M-28.9,-1.1L-28.55 -1.95Q-28.1 -3.1 -27.25 -2.95L-26.7 -2.95Q-27.7 -1.65 -28.9 -1.1M-18.35,-1.8Q-15.1 -10.3 -9.6 -6.05Q-15.1 -6.2 -18.35 -1.8M-18.35,1.1Q-15.1 5.45 -9.6 5.35Q-15.1 9.55 -18.35 1.1M-26.7,2.2L-27.25 2.25Q-28.1 2.4 -28.55 1.2L-28.9 0.35Q-27.7 0.9 -26.7 2.2" />
        <path fill="#00effc"
          d="M-21.05,-8.25Q-13.6 -15.95 -1.3 -12.1Q-7.85 -8.5 -5.85 -4.35Q-2.3 -4.85 10.5 0.15Q0 4.35 -5.85 3.65Q-7.85 7.75 -1.25 12.45Q-13.6 15.2 -21.05 7.5Q-29.55 4.05 -30.2 -0.35Q-29.55 -4.8 -21.05 -8.25M-26.7,-2.95L-27.25 -2.95Q-28.1 -3.1 -28.55 -1.95L-28.9 -1.1Q-27.7 -1.65 -26.7 -2.95M-9.6,-6.05Q-15.1 -10.3 -18.35 -1.8Q-15.1 -6.2 -9.6 -6.05M-9.6,5.35Q-15.1 5.45 -18.35 1.1Q-15.1 9.55 -9.6 5.35M-28.9,0.35L-28.55 1.2Q-28.1 2.4 -27.25 2.25L-26.7 2.2Q-27.7 0.9 -28.9 0.35" />
      </g> -->

      <!-- Head with glowing eyes -->
      <g id="Cabeza">
        <!-- Dark details -->
        <path fill="#000"
          d="M-28.9,-1.1L-28.55 -1.95Q-28.1 -3.1 -27.25 -2.95L-26.7 -2.95Q-27.7 -1.65 -28.9 -1.1M-18.35,-1.8Q-15.1 -10.3 -9.6 -6.05Q-15.1 -6.2 -18.35 -1.8M-18.35,1.1Q-15.1 5.45 -9.6 5.35Q-15.1 9.55 -18.35 1.1M-26.7,2.2L-27.25 2.25Q-28.1 2.4 -28.55 1.2L-28.9 0.35Q-27.7 0.9 -26.7 2.2" />

        <!-- Main cyan head -->
        <path fill="#00effc"
          d="M-21.05,-8.25Q-13.6 -15.95 -1.3 -12.1Q-7.85 -8.5 -5.85 -4.35Q-2.3 -4.85 10.5 0.15Q0 4.35 -5.85 3.65Q-7.85 7.75 -1.25 12.45Q-13.6 15.2 -21.05 7.5Q-29.55 4.05 -30.2 -0.35Q-29.55 -4.8 -21.05 -8.25M-26.7,-2.95L-27.25 -2.95Q-28.1 -3.1 -28.55 -1.95L-28.9 -1.1Q-27.7 -1.65 -26.7 -2.95M-9.6,-6.05Q-15.1 -10.3 -18.35 -1.8Q-15.1 -6.2 -9.6 -6.05M-9.6,5.35Q-15.1 5.45 -18.35 1.1Q-15.1 9.55 -9.6 5.35M-28.9,0.35L-28.55 1.2Q-28.1 2.4 -27.25 2.25L-26.7 2.2Q-27.7 0.9 -28.9 0.35" />

        <!-- ===== Glowing Eyes ===== -->
        <!-- Outer glow -->
        <circle cx="-12" cy="-4.2" r="3.8" fill="#00ffff" opacity="0.35" />
        <circle cx="-12" cy="4.2" r="3.8" fill="#00ffff" opacity="0.35" />

        <!-- Bright eye -->
        <circle cx="-12" cy="-4.2" r="2.6" fill="#a0ffff" />
        <circle cx="-12" cy="4.2" r="2.6" fill="#a0ffff" />

        <!-- Core / pupil highlight -->
        <circle cx="-12.6" cy="-4.2" r="1.1" fill="#ffffff" />
        <circle cx="-12.6" cy="4.2" r="1.1" fill="#ffffff" />
      </g>

      <!-- Spine plate -->
      <g id="Espina">
        <linearGradient id="gradSpineTop" gradientUnits="userSpaceOnUse"
          gradientTransform="matrix(0.0229492,0,0,-0.0152893,0,0.05)" x1="-819.2" y1="0" x2="819.2" y2="0">
          <stop offset="0" stop-color="#00eeff" />
          <stop offset="1" stop-color="#00454e" />
        </linearGradient>
        <linearGradient id="gradSpineBot" gradientUnits="userSpaceOnUse"
          gradientTransform="matrix(0.0229492,0,0,0.0152893,0,-0.05)" x1="-819.2" y1="0" x2="819.2" y2="0">
          <stop offset="0" stop-color="#00eeff" />
          <stop offset="1" stop-color="#00eaff" />
        </linearGradient>
        <path fill="url(#gradSpineTop)"
          d="M-18.8,0Q-17.85 -5.7 -12.3 -9.6Q-11.2 -5.35 -6.5 -8.25L-6.45 -8.2L-6.2 -8.3Q1.25 -16.25 6.65 -12.4Q0.05 -12.55 0 -5.95Q2.7 -2.4 7.75 -4.1Q18 -1.45 18.8 0L-18.8 0" />
        <path fill="url(#gradSpineBot)"
          d="M18.8,0Q18 1.45 7.75 4.1Q2.7 2.4 0 5.95Q0.05 12.55 6.65 12.4Q1.25 16.25 -6.2 8.35Q-6.35 8.25 -6.45 8.25L-6.5 8.25Q-11.2 5.35 -12.3 9.6Q-17.85 5.7 -18.8 0L18.8 0" />
      </g>

      <!-- Pointed Tail tip -->
      <g id="Cola">
        <linearGradient id="gradTail" gradientUnits="userSpaceOnUse" x1="-30" y1="0" x2="20" y2="0">
          <stop offset="0" stop-color="#00eeff" />
          <stop offset="1" stop-color="#003d45" />
        </linearGradient>
        <path fill="url(#gradTail)" d="M-22,0
             Q-12 -8  -4 -6
             Q 6 -10  18 0
             Q 6  10 -4  6
             Q-12  8 -22 0 Z" />
      </g>
    </defs>

    <g id="dragon-layer"></g>
    <g id="human-layer"></g>
  </svg>

  <script src="script.js"></script>
</body>

</html>
